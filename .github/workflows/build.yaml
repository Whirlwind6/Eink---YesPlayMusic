name: Build Windows Zip (E-Ink)

# 只出 Windows zip 绿色版，不出安装包也不出单文件 portable：
#   *.zip → 解压即用，启动最快（portable 每次启动都要先解压自身到 %TEMP%）
#
# 触发：push（任意分支，含打 tag）、或在 Actions 页面手动 Run workflow。
# 产物：Actions → 本次运行 → Artifacts → YesPlayMusic-EInk-win-zip
#
# 相比上游 build.yaml 的改动：
#   1. 去掉 mac / ubuntu 矩阵，只留 windows-latest；
#   2. 不再用 samuelmeuli/action-electron-builder（它自带 Node 20 运行时，
#      且用已废弃的 ::set-output），改成直接跑 yarn 脚本；
#   3. checkout / setup-node / upload-artifact 升到跑 Node 24 的主版本
#      （checkout@v5、setup-node@v5、upload-artifact@v6），消掉
#      "Node.js 20 is deprecated" 告警。注意 upload-artifact 的 v5 仍是 node20，
#      必须 v6 才消。
#   4. 去掉 @unblockneteasemusic/rust-napi 依赖，因此删掉上游"补装 Windows 版
#      解锁模块"那一步（原来要给 CI 单独装 win32-x64-msvc 的 .node）。

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 16
          cache: 'yarn'

      - name: 安装依赖
        run: yarn --ignore-optional --network-timeout 600000
        shell: bash

      - name: 构建 zip 绿色版
        shell: bash
        env:
          VUE_APP_NETEASE_API_URL: /api
          VUE_APP_ELECTRON_API_URL: /api
          VUE_APP_ELECTRON_API_URL_DEV: http://127.0.0.1:10754
          VUE_APP_LASTFM_API_KEY: 09c55292403d961aa517ff7f5e8a3d9c
          VUE_APP_LASTFM_API_SHARED_SECRET: 307c9fda32b3904e53654baff215cb67
          # 没有代码签名证书，别让 electron-builder 去找，省一轮重试
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: yarn electron:build-win

      - name: 归档
        uses: actions/upload-artifact@v6
        with:
          name: YesPlayMusic-EInk-win-zip
          path: dist_electron/*-win-x64.zip
          if-no-files-found: error
