name: Build Windows Zip (E-Ink)

# 只出 Windows zip 绿色版，不出安装包也不出单文件 portable：
#   *.zip → 解压即用，启动最快（portable 每次启动都要先解压自身到 %TEMP%）
#
# 触发：push（任意分支，含打 tag）、或在 Actions 页面手动 Run workflow。
# 产物：Actions → 本次运行 → Artifacts → YesPlayMusic-EInk-win-zip
#
# 相比上游 build.yaml 的改动：
#   1. 去掉 mac / ubuntu 矩阵，只留 windows-latest；
#   2. 不再用 samuelmeuli/action-electron-builder（它自带 Node 20 运行时，
#      且用已废弃的 ::set-output），改成直接跑 yarn 脚本；
#   3. checkout / setup-node / upload-artifact 升到跑 Node 24 的主版本
#      （checkout@v5、setup-node@v5、upload-artifact@v6），消掉
#      "Node.js 20 is deprecated" 告警。注意 upload-artifact 的 v5 仍是 node20，
#      必须 v6 才消。
#   4. 去掉 @unblockneteasemusic/rust-napi 依赖，因此删掉上游"补装 Windows 版
#      解锁模块"那一步（原来要给 CI 单独装 win32-x64-msvc 的 .node）。
#   5. 构建命令里显式写死 --win zip --x64。
#      vue.config.js 里的 win.target 只是"声明"，真正决定打什么包的是命令行参数。
#      不写 target 时 electron-builder 会把 --win 解析成空 target 表再回落到配置，
#      一旦仓库里的 vue.config.js 没同步（还是带 nsis 的旧版），产出的就是
#      Setup.exe 而不是 zip，归档步骤于是报 "No files were found"。显式传参可以
#      让产物不受配置文件版本影响。
#   6. 归档前加兜底：万一 electron-builder 只做了 --dir 预处理（只有 win-unpacked
#      目录、没有压缩包），就用 7z 现场压一个，保证 artifact 一定拿得到。

on:
  push:
  workflow_dispatch:

env:
  # 没有代码签名证书，别让 electron-builder 去找，省一轮重试
  # 值必须写成字符串，YAML 的布尔会被 runner 当成 null 处理
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 16
          cache: 'yarn'

      - name: 安装依赖
        run: yarn --ignore-optional --network-timeout 600000
        shell: bash

      - name: 构建 zip 绿色版
        shell: bash
        env:
          VUE_APP_NETEASE_API_URL: /api
          VUE_APP_ELECTRON_API_URL: /api
          VUE_APP_ELECTRON_API_URL_DEV: http://127.0.0.1:10754
          VUE_APP_LASTFM_API_KEY: 09c55292403d961aa517ff7f5e8a3d9c
          VUE_APP_LASTFM_API_SHARED_SECRET: 307c9fda32b3904e53654baff215cb67
        # --win zip --x64 必须显式写：只写 -w 时 electron-builder 拿的是配置里的
        # target，配置一旦没同步就打错包。
        #
        # 千万不要在这里再追加 --publish never：package.json 的 electron:build
        # 脚本里已经有 -p never。插件把命令行原样交给 electron-builder 的 yargs
        # 解析，同一个选项出现两次会被解析成数组 ["never","never"]，而
        # electron-builder 只做 `publish !== "never"` 的字符串比较，数组永远不等
        # 于字符串，isPublish 因此被误判为 true；CI 上再叠加默认的 onTagOrDraft
        # 策略，就会去 new GitHubPublisher，没有 GH_TOKEN 立刻抛
        #   InvalidConfigurationError: GitHub Personal Access Token is not set
        # ——zip 其实已经打好，但进程退出码 1，整步判失败。
        # 现在 vue.config.js 里也删掉了 publish 配置，属于双保险。
        run: |
          set -o pipefail
          yarn electron:build --win zip --x64 2>&1 | tee build-electron.log
          # @vue/cli-plugin-electron-builder 在主进程 bundle 编译失败时只打一行
          # ERROR 就继续往下走，进程仍然 exit 0，electron-builder 因此根本没被调用，
          # dist_electron 里只剩一个 bundled 目录。不拦这一道，错误就会被伪装成
          # "归档找不到文件 / win-unpacked 不存在"，白跑一整轮。
          # 最常见的触发原因是主进程代码用了 webpack 4 解析器不认识的语法（?. 和 ??）。
          if grep -q "Failed to compile" build-electron.log; then
            echo "::error::webpack 编译失败（通常是 src/background.js 等主进程文件），见上方日志"
            exit 1
          fi

      - name: 查看构建产物
        if: always()
        shell: bash
        run: |
          echo "=== dist_electron ==="
          ls -la dist_electron 2>/dev/null || echo "(目录不存在)"
          echo "=== 根层压缩包 ==="
          find dist_electron -maxdepth 1 -name '*.zip' 2>/dev/null || true
          echo "=== 解包目录 ==="
          ls -d dist_electron/*unpacked* 2>/dev/null || echo "(无)"

      - name: 兜底打包
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          zips=(dist_electron/*.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            echo "electron-builder 已产出：${zips[*]}"
            exit 0
          fi
          echo "::warning::electron-builder 没有产出 zip，改从 win-unpacked 现场压缩"
          if [ ! -d dist_electron/win-unpacked ]; then
            echo "::error::dist_electron/win-unpacked 也不存在，构建没有产出任何 Windows 包"
            echo "=== dist_electron 内容 ==="
            ls -la dist_electron 2>/dev/null || echo "(目录不存在)"
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          out="YesPlayMusic-EInk-${version}-win-x64.zip"
          sevenz="/c/Program Files/7-Zip/7z.exe"
          [ -f "$sevenz" ] || sevenz="7z"
          ( cd dist_electron/win-unpacked && "$sevenz" a -tzip -mx=5 "../${out}" ./* > /dev/null )
          ls -lh "dist_electron/${out}"

      - name: 归档
        uses: actions/upload-artifact@v6
        with:
          name: YesPlayMusic-EInk-win-zip
          path: dist_electron/*.zip
          if-no-files-found: error
