name: Build Windows (E-Ink)

# 只构建 Windows 安装包，用于墨水屏定制版的快速出包。
# 原 build.yaml 会跑 macOS/Windows/Linux 三平台矩阵，Windows 用户没必要等另外两个。
#
# 触发：Actions 页面点 "Run workflow"，或打 v* tag。
# 产物：Actions → 本次运行 → Artifacts → YesPlayMusic-EInk-win（exe 安装包）。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: 'yarn'

      - name: 安装依赖
        run: yarn --ignore-optional --network-timeout 600000
        shell: bash

      - name: 补装 Windows 版解锁模块
        # @unblockneteasemusic/rust-napi 是可选依赖，CI 上默认只装宿主平台那份；
        # 不显式补装 win32-x64 变体，打包时会缺 .node 文件导致启动崩溃。
        run: |
          unm_version=$(node -e "console.log(require('./node_modules/@unblockneteasemusic/rust-napi/package.json').version)")
          yarn add --ignore-platform --ignore-optional \
            @unblockneteasemusic/rust-napi-win32-x64-msvc@${unm_version}
        shell: bash

      - name: 构建安装包
        uses: samuelmeuli/action-electron-builder@v1.6.0
        env:
          VUE_APP_NETEASE_API_URL: /api
          VUE_APP_ELECTRON_API_URL: /api
          VUE_APP_ELECTRON_API_URL_DEV: http://127.0.0.1:10754
          VUE_APP_LASTFM_API_KEY: 09c55292403d961aa517ff7f5e8a3d9c
          VUE_APP_LASTFM_API_SHARED_SECRET: 307c9fda32b3904e53654baff215cb67
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release: false
          use_vue_cli: true
          args: --win

      - name: 归档
        uses: actions/upload-artifact@v4
        with:
          name: YesPlayMusic-EInk-win
          path: |
            dist_electron/*Setup*.exe
            dist_electron/*.exe
          if-no-files-found: error
